<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시판</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main class="container">
    <div class="page-title">
        <h1>전체 글</h1>
        <span class="count" th:text="${#lists.size(boards)} + '개'"></span>
    </div>

    <div class="cards">
        <a class="card" th:each="b : ${boards}" th:href="@{/boards/{id}(id=${b.boardId})}">
            <h2 class="card-title" th:text="${b.title}"></h2>
            <p class="card-text" th:text="${#strings.abbreviate(b.content, 90)}"></p>
            <div class="card-meta">
                <span class="avatar" th:text="${#strings.substring(b.writer, 0, 1)}"></span>
                <span th:text="${b.writer}"></span>
                <span class="dot">·</span>
                <span th:text="${#temporals.format(b.regDt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
        </a>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(boards)}">
        <p>아직 게시물이 없습니다.</p>
        <a class="btn btn-primary" th:href="@{/boards/new}">첫 글 쓰기</a>
    </div>
</main>
</body>
</html>
