<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시물 보기</title>
    <style>body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; } pre { white-space: pre-wrap; }</style>
</head>
<body>
<h1 th:text="${board.title}"></h1>
<p>작성자: <span th:text="${board.writer}"></span> · <span th:text="${#dates.format(board.regDt, 'yyyy-MM-dd HH:mm')}"></span></p>
<pre th:text="${board.content}"></pre>
<h3>첨부파일</h3>
<ul>
    <li th:each="f : ${board.files}">
        <a th:href="@{/board/file/{id}(id=${f.fileId})}" th:text="${f.origName}"></a>
        (<span th:text="${f.fileSize}"></span> bytes)
    </li>
    <li th:if="${#lists.isEmpty(board.files)}">없음</li>
</ul>
<p>
    <a th:href="@{/board}">목록</a>
    <a th:href="@{/board/{id}/edit(id=${board.boardId})}">수정</a>
</p>
<form th:action="@{/board/{id}/delete(id=${board.boardId})}" method="post" onsubmit="return confirm('삭제할까요?')">
    <button type="submit">삭제</button>
</form>
</body>
</html>
