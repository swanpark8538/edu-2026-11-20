<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시판</title>
    <link rel="stylesheet" th:href="@{/board.css}">
</head>
<body>
<main>
    <header class="page-header">
        <h1>게시판</h1>
        <a class="button primary" th:href="@{/boards/new}">글쓰기</a>
    </header>
    <p class="panel empty" th:if="${posts.isEmpty()}">등록된 게시글이 없습니다.</p>
    <ul class="panel post-list" th:unless="${posts.isEmpty()}">
        <li th:each="post : ${posts}">
            <div>
                <a class="post-title" th:href="@{/boards/{id}(id=${post.id})}" th:text="${post.title}">제목</a>
                <div class="metadata">
                    <span th:text="${post.writer}">작성자</span>
                    <time th:datetime="${post.createdAt}" th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</time>
                </div>
            </div>
            <span class="attachment-label" th:if="${post.hasAttachment}">첨부파일</span>
        </li>
    </ul>
</main>
</body>
</html>
