<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시판 · 오류</title>
    <link rel="stylesheet" th:href="@{/board.css}">
</head>
<body>
<main>
    <div class="panel article">
        <h1 th:switch="${status}">
            <span th:case="404">요청하신 항목을 찾을 수 없습니다.</span>
            <span th:case="413">첨부파일이 너무 큽니다.</span>
            <span th:case="*">요청을 처리할 수 없습니다.</span>
        </h1>
        <p th:if="${status == 413}">10MB 이하의 파일을 선택해 주세요.</p>
        <div class="actions"><a class="button" th:href="@{/boards}">게시판으로</a></div>
    </div>
</main>
</body>
</html>
