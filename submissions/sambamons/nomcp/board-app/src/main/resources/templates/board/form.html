<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${board.boardId == null ? '글쓰기' : '수정'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1 th:text="${board.boardId == null ? '글쓰기' : '게시물 수정'}">글쓰기</h1>

    <form class="form" method="post" enctype="multipart/form-data" th:object="${board}"
          th:action="${board.boardId == null} ? @{/board/add.do} : @{/board/{id}/edit.do(id=${board.boardId})}">
        <label for="title">제목</label>
        <input type="text" th:field="*{title}" maxlength="200">
        <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>

        <label for="writer">작성자</label>
        <input type="text" th:field="*{writer}" maxlength="50">
        <p class="error" th:if="${#fields.hasErrors('writer')}" th:errors="*{writer}"></p>

        <label for="content">내용</label>
        <textarea th:field="*{content}" rows="12" maxlength="4000"></textarea>
        <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>

        <th:block th:unless="${#lists.isEmpty(board.files)}">
            <label>기존 첨부파일 (체크하면 삭제)</label>
            <ul class="file-check">
                <li th:each="f : ${board.files}">
                    <label class="inline">
                        <input type="checkbox" name="deleteFileIds" th:value="${f.fileId}">
                        <span th:text="${f.orignlFileNm}"></span>
                    </label>
                </li>
            </ul>
        </th:block>

        <label for="uploadFiles">첨부파일 추가 (여러 개 선택 가능, 파일당 10MB)</label>
        <input type="file" id="uploadFiles" name="uploadFiles" multiple>

        <div class="buttons">
            <a class="btn" th:href="${board.boardId == null} ? @{/board/list.do} : @{/board/{id}/detail.do(id=${board.boardId})}">취소</a>
            <button type="submit" class="btn primary">저장</button>
        </div>
    </form>
</main>
</body>
</html>
