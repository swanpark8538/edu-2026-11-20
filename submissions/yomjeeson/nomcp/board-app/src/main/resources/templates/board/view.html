<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시물 상세</title>
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<div class="wrap">
    <h1>게시물 상세</h1>

    <p class="message" th:if="${message}" th:text="${message}"></p>

    <table class="detail">
        <tr><th>번호</th><td th:text="${board.boardId}"></td></tr>
        <tr><th>제목</th><td th:text="${board.title}"></td></tr>
        <tr><th>작성자</th><td th:text="${board.writer}"></td></tr>
        <tr><th>등록일</th><td th:text="${#temporals.format(board.regDt, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
        <tr><th>내용</th><td class="content" th:text="${board.content}"></td></tr>
        <tr>
            <th>첨부파일</th>
            <td>
                <ul class="files" th:unless="${#lists.isEmpty(board.files)}">
                    <li th:each="f : ${board.files}">
                        <a th:href="@{/board/file/{id}(id=${f.fileId})}" th:text="${f.originalName}"></a>
                        <span class="size" th:text="|(${f.displaySize})|"></span>
                    </li>
                </ul>
                <span th:if="${#lists.isEmpty(board.files)}" class="muted">없음</span>
            </td>
        </tr>
    </table>

    <div class="buttons">
        <a class="btn" th:href="@{/board/list}">목록</a>
        <a class="btn primary" th:href="@{/board/edit/{id}(id=${board.boardId})}">수정</a>
        <form th:action="@{/board/delete/{id}(id=${board.boardId})}" method="post" class="inline"
              onsubmit="return confirm('삭제하시겠습니까? 첨부파일도 함께 삭제됩니다.');">
            <button type="submit" class="btn danger">삭제</button>
        </form>
    </div>
</div>
</body>
</html>
