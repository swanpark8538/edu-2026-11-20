<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.boardId == null} ? '게시물 등록' : '게시물 수정'">게시물 등록</title>
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<div class="wrap" th:with="isNew=${board.boardId == null}">
    <h1 th:text="${isNew} ? '게시물 등록' : '게시물 수정'">게시물 등록</h1>

    <form th:object="${board}" method="post" enctype="multipart/form-data"
          th:action="${isNew} ? @{/board/new} : @{/board/edit/{id}(id=${board.boardId})}">
        <table class="detail">
            <tr th:unless="${isNew}">
                <th>번호</th><td th:text="*{boardId}"></td>
            </tr>
            <tr>
                <th><label for="title">제목 *</label></th>
                <td>
                    <input type="text" th:field="*{title}" maxlength="200" required>
                    <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
                </td>
            </tr>
            <tr>
                <th><label for="writer">작성자 *</label></th>
                <td>
                    <input type="text" th:field="*{writer}" maxlength="50" required>
                    <p class="error" th:if="${#fields.hasErrors('writer')}" th:errors="*{writer}"></p>
                </td>
            </tr>
            <tr>
                <th><label for="content">내용</label></th>
                <td>
                    <textarea th:field="*{content}" rows="10" maxlength="4000"></textarea>
                    <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
                </td>
            </tr>
            <tr th:unless="${isNew or #lists.isEmpty(board.files)}">
                <th>기존 첨부파일</th>
                <td>
                    <ul class="files">
                        <li th:each="f : ${board.files}">
                            <label>
                                <input type="checkbox" name="deleteFileIds" th:value="${f.fileId}"> 삭제
                            </label>
                            <a th:href="@{/board/file/{id}(id=${f.fileId})}" th:text="${f.originalName}"></a>
                            <span class="size" th:text="|(${f.displaySize})|"></span>
                        </li>
                    </ul>
                </td>
            </tr>
            <tr>
                <th>첨부파일</th>
                <td>
                    <input type="file" name="uploadFiles" multiple>
                    <p class="muted">여러 파일을 선택할 수 있습니다. (파일당 최대 10MB)</p>
                </td>
            </tr>
        </table>

        <div class="buttons">
            <a class="btn" th:href="${isNew} ? @{/board/list} : @{/board/view/{id}(id=${board.boardId})}">취소</a>
            <button type="submit" class="btn primary">저장</button>
        </div>
    </form>
</div>
</body>
</html>
