server.port=8080
spring.application.name=board-app

# 내장 HSQL DB (메모리 모드, 기동 시 schema.sql 실행)
spring.datasource.url=jdbc:hsqldb:mem:boarddb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

# 메시지 (EgovAbstractServiceImpl 이 messageSource 빈을 주입받음)
spring.messages.basename=messages,message/message-common,org/egovframe/rte/fdl/idgnr/messages/idgnr
spring.messages.use-code-as-default-message=true
spring.messages.encoding=UTF-8

# 첨부파일
board.upload-dir=./upload-files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.thymeleaf.cache=false
server.servlet.encoding.force=true
server.servlet.session.tracking-modes=cookie
