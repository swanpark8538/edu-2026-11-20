<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${boardVO.boardId == null or boardVO.boardId == ''} ? '글쓰기' : '글 수정'">글쓰기</title>
    <link rel="stylesheet" th:href="@{/css/board.css}"/>
</head>
<body>
<header class="top">
    <div class="wrap">
        <h1><a th:href="@{/boardList.do}">게시판</a></h1>
    </div>
</header>
<main class="wrap panel">
    <h2 th:text="${boardVO.boardId == null or boardVO.boardId == ''} ? '글쓰기' : '글 수정'">글쓰기</h2>
    <p class="notice" th:if="${message}" th:text="${message}">알림</p>
    <form th:action="${boardVO.boardId == null or boardVO.boardId == ''} ? @{/addBoard.do} : @{/updateBoard.do}"
          th:object="${boardVO}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:if="*{boardId != null and boardId != ''}" th:field="*{boardId}"/>
        <div class="fields">
            <label>제목
                <input type="text" th:field="*{title}" maxlength="200"/>
                <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">제목 오류</span>
            </label>
            <label>작성자
                <input type="text" th:field="*{writer}" maxlength="50"/>
                <span class="error" th:if="${#fields.hasErrors('writer')}" th:errors="*{writer}">작성자 오류</span>
            </label>
            <label>내용
                <textarea th:field="*{content}" maxlength="4000"></textarea>
                <span class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">내용 오류</span>
            </label>
            <label>첨부파일
                <input type="file" name="files" multiple="multiple"/>
            </label>
        </div>
        <ul class="files" th:if="${fileList != null and !fileList.isEmpty()}">
            <li th:each="file : ${fileList}">
                <span>
                    <a th:href="@{/boardFileDownload.do(fileId=${file.fileId})}" th:text="${file.orgFileNm}">file.txt</a>
                    <span th:text="| (${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 1)} KB)|"> (1.0 KB)</span>
                </span>
                <button class="danger" type="submit"
                        th:formaction="@{/deleteBoardFile.do}"
                        th:formmethod="post"
                        th:name="fileId"
                        th:value="${file.fileId}"
                        onclick="return confirm('첨부파일을 삭제하시겠습니까?');">삭제</button>
            </li>
        </ul>
        <div class="actions">
            <a class="button secondary" th:href="@{/boardList.do}">목록</a>
            <button type="submit">저장</button>
        </div>
    </form>
</main>
</body>
</html>
