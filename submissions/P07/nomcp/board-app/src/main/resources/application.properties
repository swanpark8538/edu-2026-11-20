spring.application.name=board-app

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 세션: 쿠키로만 추적하고 스크립트 접근과 교차 사이트 전송을 막는다
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# 오류 응답에 내부 정보를 노출하지 않는다
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.server-header=
server.tomcat.redirect-context-root=false

# 내장 HSQLDB(메모리)
spring.datasource.url=jdbc:hsqldb:mem:boarddb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:/db/schema.sql
spring.sql.init.data-locations=classpath:/db/data.sql

# 업로드 용량 제한
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-swallow-size=60MB

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true

spring.web.resources.cache.period=3600

# 첨부파일 (실행 시 --Globals.fileStorePath=<경로> 로 지정)
Globals.fileStorePath=./upload
Globals.fileUpload.extensions=hwp,hwpx,doc,docx,xls,xlsx,ppt,pptx,pdf,txt,csv,jpg,jpeg,png,gif,bmp,zip
Globals.fileUpload.maxCount=10
