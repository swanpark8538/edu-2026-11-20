<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시물 보기</title>
<link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<div class="wrap">
	<h1><a th:href="@{/board/list}">게시판</a></h1>
	<div class="msg" th:if="${message}" th:text="${message}"></div>

	<div class="card">
		<h2 th:text="${board.title}"></h2>
		<div class="meta">
			<span th:text="${board.boardId}"></span> ·
			작성자 <span th:text="${board.writer}"></span> ·
			<span th:text="${#temporals.format(board.regDt, 'yyyy-MM-dd HH:mm')}"></span> ·
			조회 <span th:text="${board.viewCnt}"></span>
		</div>
		<div class="content" th:text="${board.content}"></div>

		<div th:if="${!#lists.isEmpty(board.attachments)}">
			<ul class="files">
				<li th:each="f : ${board.attachments}">
					📎 <a th:href="@{/board/file/{id}(id=${f.fileId})}" th:text="${f.origName}"></a>
					<span class="size" th:text="'(' + ${#numbers.formatDecimal(f.fileSize / 1024.0, 1, 1)} + ' KB)'"></span>
				</li>
			</ul>
		</div>

		<div class="actions">
			<a class="btn sub" th:href="@{/board/list}">목록</a>
			<a class="btn" th:href="@{/board/{id}/edit(id=${board.boardId})}">수정</a>
			<form th:action="@{/board/{id}/delete(id=${board.boardId})}" method="post"
				  onsubmit="return confirm('삭제하시겠습니까?');">
				<button type="submit" class="btn danger">삭제</button>
			</form>
		</div>
	</div>
</div>
</body>
</html>
