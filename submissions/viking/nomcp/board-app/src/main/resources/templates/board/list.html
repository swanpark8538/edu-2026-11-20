<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판</title>
<link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<div class="wrap">
	<h1><a th:href="@{/board/list}">게시판</a></h1>
	<div class="msg" th:if="${message}" th:text="${message}"></div>

	<div class="toolbar">
		<form th:action="@{/board/list}" method="get">
			<input type="text" name="keyword" th:value="${searchVO.keyword}" placeholder="제목 또는 작성자">
			<button type="submit" class="btn sub">검색</button>
		</form>
		<a class="btn" th:href="@{/board/new}">글쓰기</a>
	</div>

	<div class="card">
		<table>
			<thead>
				<tr><th class="num">번호</th><th>제목</th><th class="num">작성자</th><th class="num">작성일</th><th class="num">조회</th></tr>
			</thead>
			<tbody>
				<tr th:each="b : ${boards}">
					<td class="num" th:text="${b.boardId}"></td>
					<td>
						<a th:href="@{/board/{id}(id=${b.boardId})}" th:text="${b.title}"></a>
						<span class="size" th:if="${b.fileCnt > 0}" th:text="'📎' + ${b.fileCnt}"></span>
					</td>
					<td class="num" th:text="${b.writer}"></td>
					<td class="num" th:text="${#temporals.format(b.regDt, 'yyyy-MM-dd')}"></td>
					<td class="num" th:text="${b.viewCnt}"></td>
				</tr>
				<tr th:if="${#lists.isEmpty(boards)}"><td colspan="5" class="empty">게시물이 없습니다.</td></tr>
			</tbody>
		</table>
	</div>

	<div class="paging">
		<th:block th:each="p : ${#numbers.sequence(1, totalPages)}">
			<span class="cur" th:if="${p == searchVO.page}" th:text="${p}"></span>
			<a th:unless="${p == searchVO.page}" th:href="@{/board/list(page=${p}, keyword=${searchVO.keyword})}" th:text="${p}"></a>
		</th:block>
	</div>
</div>
</body>
</html>
