<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시물 수정 :: eGovFrame 5.0 Boot 게시판</title>
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<div class="wrap">

    <header class="head">
        <h1><a th:href="@{/board/list}">eGovFrame 5.0 Boot 게시판</a></h1>
    </header>

    <form class="write-form" th:action="@{/board/update}" th:object="${boardVO}"
          method="post" enctype="multipart/form-data">

        <input type="hidden" th:field="*{boardId}">

        <fieldset>
            <legend>게시물 수정</legend>

            <div class="field">
                <label for="writer">작성자</label>
                <input type="text" id="writer" th:field="*{writer}" maxlength="50" readonly>
                <span class="field-error" th:if="${#fields.hasErrors('writer')}" th:errors="*{writer}">오류</span>
            </div>

            <div class="field">
                <label for="title">제목</label>
                <input type="text" id="title" th:field="*{title}" maxlength="200">
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">오류</span>
            </div>

            <div class="field">
                <label for="content">내용</label>
                <textarea id="content" th:field="*{content}" rows="12" maxlength="4000"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">오류</span>
            </div>

            <div class="field" th:if="${not #lists.isEmpty(boardVO.boardFileList)}">
                <label>현재 첨부파일 <span class="hint">(삭제할 파일을 선택하세요)</span></label>
                <ul class="file-list">
                    <li th:each="file : ${boardVO.boardFileList}">
                        <label>
                            <input type="checkbox" name="deleteAtchfileIds" th:value="${file.atchfileId}">
                            <span th:text="${file.fileOrglnm}">파일명</span>
                            <span class="size"
                                  th:text="${#numbers.formatDecimal(file.fileSize, 1, 0)} + ' bytes'">0 bytes</span>
                        </label>
                        <a class="dl" th:href="@{/board/file/download(atchfileId=${file.atchfileId})}">다운로드</a>
                    </li>
                </ul>
            </div>

            <div class="field">
                <label for="files">새 첨부파일 <span class="hint">(최대 10MB / 다중 선택 가능)</span></label>
                <input type="file" id="files" name="files" multiple>
            </div>
        </fieldset>

        <div class="buttons">
            <a class="btn" th:href="@{/board/detail(boardId=${boardVO.boardId})}">취소</a>
            <button type="submit" class="btn primary">수정 완료</button>
        </div>

    </form>

</div>
</body>
</html>
