#====================================================================
# eGovFrame 5.0 Boot 게시판 (board-app)
#====================================================================
spring.application.name=board-app
server.port=8080

# 요청·응답 문자셋 (한글 처리)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

#--------------------------------------------------------------------
# 내장 HSQLDB (기동 시 schema/data 스크립트로 테이블과 초기 데이터를 만든다)
#   종료할 때마다 데이터를 남기려면 아래 URL 을 파일 DB 로 바꾼다.
#   ex) jdbc:hsqldb:file:data/hsqldb/egovboard;shutdown=true
#       (파일 DB 로 바꾸면 초기화 스크립트가 매번 다시 실행되지 않도록
#        spring.sql.init.mode=never 로 설정한다)
#--------------------------------------------------------------------
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.url=jdbc:hsqldb:mem:egovboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.pool-name=BoardHikariPool
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/schema-hsql.sql
spring.sql.init.data-locations=classpath:db/data-hsql.sql

#--------------------------------------------------------------------
# MyBatis (표준프레임워크 데이터접근 EgovAbstractMapper 사용)
#--------------------------------------------------------------------
mybatis.mapper-locations=classpath:egovframework/sqlmap/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL
mybatis.configuration.default-statement-timeout=30

#--------------------------------------------------------------------
# 첨부파일 업로드
#--------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
# 첨부파일을 저장할 루트 디렉터리 (상대 경로는 애플리케이션 실행 위치 기준)
board.file.upload-dir=data/upload
# 업로드를 허용할 확장자 (비워 두면 확장자 검사 없음)
board.file.allowed-extensions=jpg,jpeg,gif,png,pdf,txt,hwp,doc,docx,xls,xlsx,ppt,pptx,zip
# 첨부파일 하나의 최대 크기 (byte)
board.file.max-size=10485760

#--------------------------------------------------------------------
# 로그 (egov.board.persistence 수준을 debug 로 두면 실행 SQL 이 출력된다)
#--------------------------------------------------------------------
logging.level.egov.board=debug
logging.level.egov.board.persistence=debug
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
