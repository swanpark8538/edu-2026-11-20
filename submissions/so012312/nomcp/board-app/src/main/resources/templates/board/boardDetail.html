<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('게시물 상세')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1 class="page-title">게시물 상세</h1>

    <table class="view-table">
        <tbody>
        <tr>
            <th scope="row">번호</th>
            <td th:text="${#numbers.formatInteger(#strings.substring(board.boardId, 4), 1)}">1</td>
            <th scope="row">조회수</th>
            <td th:text="${board.viewCnt}">0</td>
        </tr>
        <tr>
            <th scope="row">제목</th>
            <td colspan="3" th:text="${board.title}">제목</td>
        </tr>
        <tr>
            <th scope="row">글쓴이</th>
            <td th:text="${board.writer}">글쓴이</td>
            <th scope="row">작성일</th>
            <td th:text="${board.regDtForView}">2026-11-20 10:00</td>
        </tr>
        <tr th:if="${board.modDt != null}">
            <th scope="row">수정일</th>
            <td colspan="3" th:text="${board.modDtForView}">2026-11-20 10:00</td>
        </tr>
        </tbody>
    </table>

    <div class="view-content" th:text="${board.content}">내용</div>

    <div class="atc-file-box" th:if="${not #lists.isEmpty(board.atcFileList)}">
        <h2>첨부파일 <span th:text="${board.atcFileNo}"></span>개</h2>
        <ul>
            <li th:each="atcFile : ${board.atcFileList}">
                <a th:href="@{/board/file/download(atcFileId=${atcFile.atcFileId})}"
                   th:text="${atcFile.fileNm}">파일명</a>
                <span class="atc-size" th:text="${atcFile.fileSizeForView}">1 KB</span>
                <span class="atc-id" th:text="'(ID ' + ${atcFile.atcFileId} + ')'"></span>
            </li>
        </ul>
    </div>

    <div class="button-bar">
        <a class="btn" th:href="@{/board(currentPageNo=${searchVO.currentPageNo},
                                         searchCond=${searchVO.searchCond},
                                         searchWord=${searchVO.searchWord})}">목록</a>
        <a class="btn" th:href="@{/board/editForm(boardId=${board.boardId},
                                                  currentPageNo=${searchVO.currentPageNo},
                                                  searchCond=${searchVO.searchCond},
                                                  searchWord=${searchVO.searchWord})}">수정</a>
        <form id="deleteForm" method="post" th:action="@{/board/delete}">
            <input type="hidden" name="boardId" th:value="${board.boardId}"/>
            <input type="hidden" name="currentPageNo" th:value="${searchVO.currentPageNo}"/>
            <input type="hidden" name="searchCond" th:value="${searchVO.searchCond}"/>
            <input type="hidden" name="searchWord" th:value="${searchVO.searchWord}"/>
            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('이 게시물을 삭제하시겠습니까?');">삭제</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
